name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: cd backend && ruff check .
      - name: Format check
        run: cd backend && ruff format --check .
      - name: Tests
        run: cd backend && pytest --tb=short

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd extension && npm install
      - name: Typecheck
        run: cd extension && npm run typecheck
      - name: Lint
        run: cd extension && npm run lint
